[server]
# Somente acesso local: a aplicação não deve ser exposta na rede.
address = "localhost"
port = 8501
headless = true
maxUploadSize = 1

[browser]
gatherUsageStats = false
serverAddress = "localhost"

[theme]
base = "light"
primaryColor = "#2463D6"
backgroundColor = "#F4F7FB"
secondaryBackgroundColor = "#EAF0F6"
textColor = "#1C3554"
font = "sans serif"

[client]
toolbarMode = "minimal"
